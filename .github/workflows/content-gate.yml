name: content-gate

# Runs on every pull request. pull_request_target means this workflow and the
# check script always come from the base branch, never from the PR branch, so
# a PR cannot edit or disable its own gate. No PR code is executed; the PR is
# only read as text through the GitHub API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: content-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  content-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out base branch (trusted copy of the check script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Fetch the PR file list and diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | [.status, .filename] | @tsv' > "$RUNNER_TEMP/files.tsv"
          gh pr diff "$PR" --repo "$REPO" > "$RUNNER_TEMP/pr.diff"

      - name: Run content rules
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bash scripts/content-check.sh "$RUNNER_TEMP/files.tsv" "$RUNNER_TEMP/pr.diff" "$HEAD_REF"
