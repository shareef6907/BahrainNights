name: content-gate

# Runs on every pull request. pull_request_target means this workflow and the
# check script always come from the base branch, never from the PR branch, so
# a PR cannot edit or disable its own gate. No PR code is executed; the PR is
# only read as text through the GitHub API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: content-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  content-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out base branch (trusted copy of the check script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Fetch the PR file list and diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | [.status, .filename] | @tsv' > "$RUNNER_TEMP/files.tsv"

          # `gh pr diff` asks the API for a rendered diff, and GitHub refuses
          # that for any PR with more than 300 changed files:
          #   HTTP 406: Sorry, the diff exceeded the maximum number of files (300).
          # So a bulk change (e.g. untracking a committed node_modules tree of
          # 800+ files) could not be validated by this gate at all -- the run
          # died before the rules were ever evaluated.
          #
          # Fall back to building the same diff from the two commits, which
          # has no file-count limit. `git diff BASE HEAD` reports every line
          # present in HEAD but not in BASE with a leading '+', which is
          # exactly the set of added lines the rules below inspect. It reads
          # git objects only and never executes any code from the PR.
          if ! gh pr diff "$PR" --repo "$REPO" > "$RUNNER_TEMP/pr.diff" 2> "$RUNNER_TEMP/pr.diff.err"; then
            echo "::notice::gh pr diff failed; rebuilding the diff from git."
            cat "$RUNNER_TEMP/pr.diff.err"
            git fetch --no-tags --quiet origin \
              "+refs/pull/$PR/head:refs/remotes/pr/head" || true
            git diff --no-color "$BASE_SHA" refs/remotes/pr/head > "$RUNNER_TEMP/pr.diff"
          fi

          echo "files listed: $(wc -l < "$RUNNER_TEMP/files.tsv")"
          echo "diff lines:   $(wc -l < "$RUNNER_TEMP/pr.diff")"

      - name: Run content rules
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bash scripts/content-check.sh "$RUNNER_TEMP/files.tsv" "$RUNNER_TEMP/pr.diff" "$HEAD_REF"
