name: Cinema Sync - VOX & Cineco Bahrain

# Cinema Scraper for BahrainNights
# Runs Monday, Wednesday, Friday at 6 AM Bahrain time (3 AM UTC)
# Scrapes VOX and Cineco cinemas using Playwright browser automation
# Deduplicates movies and updates the database with TMDB metadata

on:
  schedule:
    - cron: '0 3 * * 1,3,5'  # 3 AM UTC = 6 AM Bahrain | Mon, Wed, Fri
  workflow_dispatch:  # Allow manual runs

jobs:
  sync-cinema:
    # Pinned deliberately. `ubuntu-latest` now resolves to ubuntu26.04, which
    # Playwright 1.57.0 does not support:
    #   ERROR: Playwright does not support chromium on ubuntu26.04-x64
    # The failure happens in the "install browsers" step, i.e. before the
    # scraper runs at all, so the whole cinema sync has been silently failing.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        # The browser-install CLI MUST come from the SAME `playwright` package
        # that the scrapers import.
        #
        # package-lock.json pins TWO different Playwright versions:
        #   node_modules/playwright                        = 1.61.1  <- what
        #       scripts/scrape-cineco.ts imports (`import { chromium } from
        #       'playwright'`) -> expects chromium-headless-shell build 1228
        #   node_modules/@playwright/test                  = 1.57.0
        #       node_modules/@playwright/test/node_modules/playwright = 1.57.0
        #
        # `npm` links the `playwright` bin from @playwright/test, so BOTH
        # `npx playwright` AND `./node_modules/.bin/playwright` resolve to
        # 1.57.0 -> they download build 1200, while the runtime demands 1228:
        #
        #   browserType.launch: Executable doesn't exist at
        #   .../chromium_headless_shell-1228/chrome-headless-shell-linux64/chrome-headless-shell
        #
        # The Cineco scraper catches that error, so the job still exited 0 and
        # Cineco silently contributed 0 movies while VOX (which uses native
        # fetch + cheerio, no browser) kept working.
        #
        # Invoking node_modules/playwright/cli.js directly guarantees the CLI
        # and the runtime are the same package, so they cannot diverge. The
        # version assertion below turns any future divergence into a loud
        # failure instead of a silently-empty scrape.
        run: |
          set -euo pipefail
          CLI_VER=$(node node_modules/playwright/cli.js --version | awk '{print $2}')
          MOD_VER=$(node -p "require('./node_modules/playwright/package.json').version")
          echo "Playwright CLI    : $CLI_VER"
          echo "Playwright module : $MOD_VER"
          if [ "$CLI_VER" != "$MOD_VER" ]; then
            echo "::error::Playwright CLI ($CLI_VER) and module ($MOD_VER) differ — the downloaded browser build would not match the runtime, and the Cineco scrape would silently return 0 movies."
            exit 1
          fi
          node node_modules/playwright/cli.js install chromium --with-deps

      - name: Run Cinema Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npx tsx scripts/sync-cinema.ts